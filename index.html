<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>A Level History Trainer</title>
  <meta name="description" content="A Level History revision built for Edexcel. 10-minute practice using the specification, past papers and examiner reports.">
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f7f5f0;
      color: #18202a;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 28px 20px;
    }

    .card {
      width: 100%;
      max-width: 520px;
      text-align: center;
    }

    h1 {
      font-size: 38px;
      line-height: 1.05;
      margin: 0 0 14px;
    }

    .tagline {
      font-size: 21px;
      line-height: 1.4;
      margin-bottom: 12px;
    }

    .free {
      font-size: 17px;
      font-weight: 700;
      margin-bottom: 28px;
    }

    .button {
      display: block;
      width: 100%;
      padding: 17px 20px;
      margin: 13px 0;
      border-radius: 12px;
      background: #111;
      color: white;
      text-decoration: none;
      font-size: 18px;
      font-weight: 700;
    }

    .small {
      margin-top: 28px;
      font-size: 14px;
      line-height: 1.5;
      color: #626872;
    }
  </style>
</head>

<body>
  <main class="card">
    <h1>A Level History Trainer</h1>

    <div class="tagline">
      10 minutes a day.<br>
      Your actual Edexcel History paper.
    </div>

    <div class="free">
      First paper free • No subscription
    </div>

    <a class="button"
       href="https://apps.apple.com/us/app/a-level-history-trainer/id6802754120">
       Download on the App Store
    </a>

    <a class="button"
       href="https://play.google.com/store/apps/details?id=com.rosiemw9677.alevelhistorytrainer">
       Get it on Google Play
    </a>

    <div class="small">
      Targeted A Level History revision built from the Edexcel specification,
      past papers and examiner reports.
    </div>
  </main>
</body>
</html>
